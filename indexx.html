<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GarbaMatch — Find your Garba partner at IILM</title>
<meta name="description" content="Don't show up to Garba solo. GarbaMatch helps IILM University, Greater Noida students find a Garba partner for the university's Garba night." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ========================================================================
   GarbaMatch — design tokens
   ==================================================================== */
:root{
  --night:#150A2E;
  --night-2:#1E0F3F;
  --ink:#0C0620;
  --magenta:#FF2E74;
  --marigold:#FFB627;
  --turquoise:#12CBC4;
  --violet:#8B5CFF;
  --cream:#FFF4E6;
  --muted:rgba(255,244,230,.62);
  --faint:rgba(255,244,230,.38);
  --line:rgba(255,244,230,.14);
  --card:rgba(255,255,255,.055);
  --card-2:rgba(255,255,255,.09);
  --r-s:12px; --r-m:18px; --r-l:26px; --r-xl:34px;
  --shadow:0 18px 50px -18px rgba(0,0,0,.75);
  --display:"Bricolage Grotesque","Outfit",system-ui,sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shell:460px;
}
:root:not([data-theme="light"]){color-scheme:dark;}
:root[data-theme="dark"]{color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--night);
  color:var(--cream);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 600px at 78% -8%, rgba(255,46,116,.30), transparent 62%),
    radial-gradient(760px 520px at 8% 4%, rgba(255,182,39,.20), transparent 60%),
    radial-gradient(900px 700px at 50% 108%, rgba(18,203,196,.16), transparent 64%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,244,230,.16) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(circle at 50% 30%, #000 10%, transparent 76%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 10%, transparent 76%);
}
#app{position:relative;z-index:1;}
img{max-width:100%;display:block;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--marigold);outline-offset:3px;border-radius:6px;}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;letter-spacing:-.02em;font-weight:700;}
p{margin:0;}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,244,230,.16);border-radius:99px}

/* ---------- shared atoms ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 22px;border-radius:99px;font-weight:600;font-size:15.5px;
  transition:transform .14s ease, box-shadow .2s ease, background .2s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(103deg,var(--magenta),#FF6B3D 52%,var(--marigold));
  color:#2A0713;box-shadow:0 12px 30px -10px rgba(255,46,116,.75);font-weight:700;
}
.btn-primary:hover{box-shadow:0 16px 38px -10px rgba(255,46,116,.9);}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--cream);}
.btn-ghost:hover{background:var(--card-2);}
.btn-danger{background:rgba(255,70,70,.14);border:1px solid rgba(255,90,90,.4);color:#FF9B9B;}
.btn-block{width:100%;}
.btn-sm{padding:9px 15px;font-size:13.5px;}
.tag{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;
  background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--muted);
}
.field{display:block;margin-bottom:14px;}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:500;}
.input, .select, .textarea{
  width:100%;padding:13px 15px;border-radius:var(--r-s);
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--cream);transition:border-color .16s ease, background .16s ease;
}
.input::placeholder,.textarea::placeholder{color:rgba(255,244,230,.3);}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--magenta);background:rgba(255,255,255,.08);}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) calc(50% - 2px),calc(100% - 14px) calc(50% - 2px);background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:40px;}
.select option{background:var(--night-2);color:var(--cream);}
.textarea{resize:vertical;min-height:92px;line-height:1.45;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.err{color:#FF8F8F;font-size:13.5px;margin-top:-4px;margin-bottom:10px;min-height:0;}
.ok{color:var(--turquoise);font-size:13.5px;margin-bottom:10px;}
.hint{color:var(--faint);font-size:12.5px;line-height:1.45;}
.link{color:var(--marigold);text-decoration:none;font-weight:600;cursor:pointer;}
.link:hover{text-decoration:underline;}
.center{text-align:center;}

/* ---------- garland ---------- */
.garland{height:26px;width:100%;overflow:hidden;position:relative;flex:none;}
.garland svg{width:100%;height:100%;display:block;}

/* ========================================================================
   LANDING
   ==================================================================== */
.land{max-width:1120px;margin:0 auto;padding:0 22px 90px;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;}
.logo{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;}
.logo b{color:var(--marigold);font-weight:800;}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center;padding:34px 0 20px;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--marigold);
  background:rgba(255,182,39,.1);border:1px solid rgba(255,182,39,.3);padding:6px 14px;border-radius:99px;margin-bottom:22px;}
.hero h1{font-size:clamp(44px,6.4vw,76px);font-weight:800;letter-spacing:-.045em;}
.hero h1 .tint{background:linear-gradient(96deg,var(--marigold),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero .sub{font-size:19px;color:var(--muted);margin:20px 0 30px;max-width:44ch;line-height:1.5;}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;}

/* garba circle hero */
.circle-stage{position:relative;display:grid;place-items:center;min-height:560px;}
.photo-panel{position:relative;width:100%;max-width:372px;aspect-ratio:3/3.9;border-radius:var(--r-xl);
  overflow:hidden;box-shadow:0 30px 70px -26px rgba(0,0,0,.85);border:1px solid rgba(255,244,230,.16);z-index:2;}
.photo-panel > img{width:100%;height:100%;object-fit:cover;object-position:52% 42%;}
.photo-panel .wash{position:absolute;inset:0;
  background:linear-gradient(196deg,rgba(255,46,116,.30) 0%,rgba(255,182,39,.10) 34%,rgba(12,6,32,.30) 62%,rgba(12,6,32,.9) 100%);}
.photo-panel .cap{position:absolute;left:20px;right:20px;bottom:18px;font-size:13.4px;color:rgba(255,244,230,.86);
  display:flex;align-items:center;gap:8px;}
.photo-panel .cap i{width:7px;height:7px;border-radius:50%;background:var(--marigold);flex:none;
  box-shadow:0 0 12px rgba(255,182,39,.9);font-style:normal;}
.rings{position:absolute;inset:0;display:grid;place-items:center;}
.ring{position:absolute;border-radius:50%;border:1px dashed rgba(255,244,230,.18);}
.ring.r1{width:300px;height:300px;}
.ring.r2{width:420px;height:420px;border-style:dotted;border-color:rgba(255,182,39,.28);}
.ring.r3{width:540px;height:540px;border-color:rgba(255,46,116,.2);}
.spin{position:absolute;width:420px;height:420px;animation:spin 34s linear infinite;}
.spin .dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--marigold);top:-4px;left:50%;margin-left:-4px;box-shadow:0 0 18px rgba(255,182,39,.9);}
.spin.b{width:540px;height:540px;animation-duration:52s;animation-direction:reverse;}
.spin.b .dot{background:var(--turquoise);box-shadow:0 0 18px rgba(18,203,196,.9);}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.demo-card{position:absolute;right:2px;bottom:34px;width:214px;z-index:4;cursor:grab;touch-action:none;user-select:none;
  filter:drop-shadow(0 22px 38px rgba(0,0,0,.6));}
.demo-card:active{cursor:grabbing;}
.demo-hint{position:absolute;left:0;bottom:2px;font-size:12.5px;color:var(--faint);z-index:5;}
@media (max-width:420px){.demo-card{width:174px;right:-2px;bottom:46px;} .photo-panel{max-width:300px;}}

.how{margin-top:78px;}
.how h2{font-size:clamp(26px,3.4vw,38px);margin-bottom:8px;}
.how .lede{color:var(--muted);margin-bottom:30px;}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;counter-reset:s;}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:20px 18px;position:relative;}
.step .n{width:26px;height:26px;border-radius:50%;background:rgba(255,182,39,.16);color:var(--marigold);
  display:grid;place-items:center;font-size:13px;font-weight:700;margin-bottom:13px;}
.step h3{font-size:16.5px;margin-bottom:6px;font-family:var(--body);font-weight:600;letter-spacing:0;}
.step p{font-size:13.6px;color:var(--muted);line-height:1.45;}
.bottom-cta{margin-top:70px;position:relative;overflow:hidden;
  border:1px solid var(--line);border-radius:var(--r-xl);padding:56px 34px;text-align:center;}
.bottom-cta .bg{position:absolute;inset:0;background-size:cover;background-position:center 26%;opacity:.42;}
.bottom-cta .veil{position:absolute;inset:0;
  background:linear-gradient(103deg,rgba(21,10,46,.94) 6%,rgba(21,10,46,.74) 42%,rgba(255,46,116,.30) 100%);}
.bottom-cta > .in{position:relative;z-index:1;}
.bottom-cta h2{font-size:clamp(26px,3.6vw,40px);margin-bottom:12px;}
.bottom-cta p{color:var(--muted);margin-bottom:26px;}
.foot{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--faint);font-size:13px;}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:6px;padding-top:14px;}
  .circle-stage{min-height:460px;order:2;margin-top:18px;}
  .ring.r3,.spin.b{display:none;}
  .steps{grid-template-columns:1fr 1fr;}
}
@media (max-width:520px){.steps{grid-template-columns:1fr;} .land{padding-inline:16px;}}

/* ========================================================================
   AUTH / SHELL
   ==================================================================== */
.pane{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:26px 18px 40px;}
.pane-inner{width:100%;max-width:412px;}
.sheet{background:rgba(21,10,46,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:var(--r-l);padding:28px 24px;box-shadow:var(--shadow);}
.sheet h2{font-size:28px;margin-bottom:6px;}
.sheet .sub{color:var(--muted);font-size:14.5px;margin-bottom:22px;}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);padding:5px;border-radius:99px;margin-bottom:22px;}
.tabs button{flex:1;padding:10px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted);transition:.16s;}
.tabs button[aria-selected="true"]{background:var(--cream);color:#23102F;}
.back-link{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;margin-bottom:18px;text-decoration:none;}
.back-link:hover{color:var(--cream);}

.shell{max-width:var(--shell);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px;position:sticky;top:0;z-index:30;
  background:linear-gradient(var(--night) 66%, rgba(21,10,46,0));backdrop-filter:blur(6px);}
.topbar .logo{font-size:19px;}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:16px;}
.icon-btn:hover{background:var(--card-2);}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,7,32,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:9px 0 calc(9px + env(safe-area-inset-bottom));}
.tabbar-inner{max-width:var(--shell);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;text-decoration:none;color:var(--faint);font-size:11.5px;font-weight:500;position:relative;}
.tabbar a .ic{font-size:20px;line-height:1;}
.tabbar a[data-on="1"]{color:var(--marigold);}
.tabbar .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:99px;
  background:var(--magenta);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;}

/* ========================================================================
   PROFILE CARD + DECK
   ==================================================================== */
.deck-wrap{position:relative;padding:4px 18px 0;flex:1;display:flex;flex-direction:column;}
.deck{position:relative;width:100%;aspect-ratio:3/4.32;max-height:60dvh;margin:0 auto;}
.pcard{position:absolute;inset:0;border-radius:var(--r-xl);overflow:hidden;background:var(--night-2);
  box-shadow:var(--shadow);border:1px solid rgba(255,244,230,.1);will-change:transform;}
.deck .pcard{touch-action:none;user-select:none;-webkit-user-select:none;}
.pcard .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.pcard .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,4,24,.94) 4%,rgba(10,4,24,.72) 30%,rgba(10,4,24,.05) 62%);}
.pcard .info{position:absolute;left:0;right:0;bottom:0;padding:20px 20px 22px;}
.pcard .nm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.pcard .nm h3{font-size:30px;font-weight:800;letter-spacing:-.03em;}
.pcard .nm .ag{font-size:20px;color:rgba(255,244,230,.8);font-weight:500;font-family:var(--body);}
.pcard .meta{color:rgba(255,244,230,.78);font-size:14.5px;margin-top:5px;font-weight:500;}
.pcard .bio{margin-top:11px;font-size:14.6px;line-height:1.45;color:rgba(255,244,230,.92);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.pcard .ig{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:7px 13px;border-radius:99px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:13px;text-decoration:none;
  backdrop-filter:blur(6px);font-weight:500;}
.pcard .ig:hover{background:rgba(255,255,255,.22);}
.stamp{position:absolute;top:26px;padding:8px 16px;border-radius:12px;font-family:var(--display);font-weight:800;
  font-size:26px;letter-spacing:.02em;opacity:0;transform:rotate(-12deg);pointer-events:none;border:4px solid;}
.stamp.like{left:22px;color:var(--turquoise);border-color:var(--turquoise);transform:rotate(-14deg);}
.stamp.pass{right:22px;color:#FF5A5A;border-color:#FF5A5A;transform:rotate(14deg);}
.pcard .corner{position:absolute;top:0;right:0;width:96px;height:96px;opacity:.5;pointer-events:none;}

.deck-actions{display:flex;align-items:center;justify-content:center;gap:26px;padding:22px 0 10px;}
.circ{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:25px;
  border:1px solid var(--line);background:rgba(255,255,255,.06);
  transition:transform .15s ease, box-shadow .2s ease, background .2s ease;}
.circ:hover{transform:translateY(-2px) scale(1.05);}
.circ:active{transform:scale(.92);}
.circ.pass{color:#FF5A5A;box-shadow:0 10px 26px -14px rgba(255,90,90,.9);}
.circ.pass:hover{background:rgba(255,90,90,.14);}
.circ.like{color:var(--turquoise);box-shadow:0 10px 26px -14px rgba(18,203,196,.9);}
.circ.like:hover{background:rgba(18,203,196,.14);}

/* empty + loading */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:56px 26px;min-height:340px;}
.empty .big{font-size:46px;margin-bottom:14px;}
.empty h3{font-size:22px;margin-bottom:8px;}
.empty p{color:var(--muted);font-size:14.6px;max-width:30ch;line-height:1.5;}
.skel{position:absolute;inset:0;border-radius:var(--r-xl);background:
  linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 70%);
  background-size:240% 100%;animation:sh 1.25s linear infinite;}
@keyframes sh{to{background-position:-240% 0}}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,244,230,.18);border-top-color:var(--marigold);animation:spin .7s linear infinite;}

/* ========================================================================
   MATCH MODAL
   ==================================================================== */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(8,3,20,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .2s ease;}
@keyframes fade{from{opacity:0}}
.modal-box{width:100%;max-width:400px;background:rgba(30,15,63,.96);border:1px solid var(--line);
  border-radius:var(--r-l);padding:24px;box-shadow:var(--shadow);animation:pop .26s cubic-bezier(.2,1.3,.4,1);max-height:88dvh;overflow:auto;}
@keyframes pop{from{transform:scale(.9) translateY(14px);opacity:0}}
.modal-box h3{font-size:22px;margin-bottom:8px;}
.modal-box .sub{color:var(--muted);font-size:14.4px;margin-bottom:18px;line-height:1.5;}
.match-screen{position:fixed;inset:0;z-index:120;display:grid;place-items:center;text-align:center;padding:26px;
  background:radial-gradient(120% 90% at 50% 12%,rgba(255,46,116,.5),rgba(12,6,32,.97) 62%);
  backdrop-filter:blur(12px);animation:fade .25s ease;}
.match-title{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,60px);letter-spacing:-.04em;
  background:linear-gradient(94deg,var(--marigold),#fff 46%,var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pop .45s cubic-bezier(.2,1.4,.4,1);}
.match-sub{color:rgba(255,244,230,.88);margin:12px 0 28px;font-size:16.5px;}
.match-faces{display:flex;justify-content:center;align-items:center;margin-bottom:6px;}
.match-faces img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,244,230,.9);}
.match-faces img:last-child{margin-left:-22px;}
.confetti{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:121;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(760deg);opacity:.15}}

/* ========================================================================
   MATCHES + CHAT
   ==================================================================== */
.list{padding:2px 18px 20px;display:flex;flex-direction:column;gap:10px;}
.mrow{display:flex;align-items:center;gap:13px;padding:12px;border-radius:var(--r-m);
  background:var(--card);border:1px solid var(--line);transition:background .16s ease;}
.mrow:hover{background:var(--card-2);}
.mrow img{width:58px;height:58px;border-radius:50%;object-fit:cover;flex:none;}
.mrow .txt{flex:1;min-width:0;}
.mrow .txt h4{font-size:16.5px;font-family:var(--body);font-weight:600;letter-spacing:0;}
.mrow .txt .meta{font-size:12.8px;color:var(--faint);margin-top:2px;}
.mrow .txt .last{font-size:13.6px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mrow .txt .last.unread{color:var(--marigold);font-weight:600;}
.sec-label{padding:16px 18px 6px;font-size:13px;color:var(--faint);font-weight:500;}

.chat{display:flex;flex-direction:column;height:100dvh;max-width:var(--shell);margin:0 auto;}
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);
  background:rgba(14,7,32,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10;}
.chat-head img{width:42px;height:42px;border-radius:50%;object-fit:cover;}
.chat-head .who{flex:1;min-width:0;}
.chat-head .who h4{font-size:16px;font-family:var(--body);font-weight:600;letter-spacing:0;}
.chat-head .who p{font-size:12.4px;color:var(--faint);}
.msgs{flex:1;overflow-y:auto;padding:18px 16px 12px;display:flex;flex-direction:column;gap:3px;}
.day{align-self:center;font-size:11.5px;color:var(--faint);background:rgba(255,255,255,.06);
  padding:4px 12px;border-radius:99px;margin:10px 0;}
.bub{max-width:76%;padding:10px 14px;border-radius:19px;font-size:15px;line-height:1.4;
  word-wrap:break-word;animation:rise .2s ease;}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.bub.me{align-self:flex-end;background:linear-gradient(120deg,var(--magenta),#FF6B3D);color:#fff;border-bottom-right-radius:6px;}
.bub.them{align-self:flex-start;background:rgba(255,255,255,.1);border:1px solid var(--line);border-bottom-left-radius:6px;}
.bub + .ts{font-size:10.8px;color:var(--faint);margin:2px 4px 8px;}
.ts.me{align-self:flex-end;} .ts.them{align-self:flex-start;}
.composer{display:flex;gap:9px;padding:11px 14px calc(13px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:rgba(14,7,32,.94);position:sticky;bottom:0;}
.composer input{flex:1;padding:12px 16px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line);}
.composer input:focus{outline:none;border-color:var(--magenta);}
.send{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:17px;
  background:linear-gradient(120deg,var(--magenta),var(--marigold));color:#2A0713;}
.send:disabled{opacity:.4;cursor:not-allowed;}
.menu{position:absolute;right:12px;top:58px;background:rgba(30,15,63,.98);border:1px solid var(--line);
  border-radius:var(--r-m);padding:6px;z-index:60;box-shadow:var(--shadow);min-width:184px;}
.menu button{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:10px;font-size:14.4px;}
.menu button:hover{background:rgba(255,255,255,.08);}
.menu button.danger{color:#FF8F8F;}

/* ========================================================================
   PROFILE PAGE
   ==================================================================== */
.me-head{padding:6px 18px 0;text-align:center;}
.me-photo{position:relative;width:132px;height:132px;margin:8px auto 14px;}
.me-photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid rgba(255,182,39,.55);}
.me-photo label{position:absolute;right:2px;bottom:4px;width:38px;height:38px;border-radius:50%;
  background:linear-gradient(120deg,var(--magenta),var(--marigold));color:#2A0713;display:grid;place-items:center;
  font-size:16px;cursor:pointer;border:3px solid var(--night);}
.me-head h2{font-size:26px;}
.me-head .meta{color:var(--muted);font-size:14.4px;margin-top:5px;}

/* photo upload slots (up to 3) */
.pslots{display:flex;gap:10px;margin-bottom:2px;}
.pslot{position:relative;flex:1;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
  background:rgba(255,255,255,.05);border:1px dashed var(--line);}
.pslot img{width:100%;height:100%;object-fit:cover;display:block;}
.pslot-add{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;
  color:var(--faint);cursor:pointer;font-weight:300;}
.pslot-add:hover{color:var(--marigold);}
.pslot-empty{border-style:dashed;opacity:.5;}
.pslot-x{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.62);color:#fff;font-size:11px;display:grid;place-items:center;border:0;}
.pslot-tag{position:absolute;bottom:5px;left:5px;font-size:10px;background:rgba(0,0,0,.55);
  padding:2px 7px;border-radius:6px;color:rgba(255,244,230,.9);}

/* password visibility toggle */
.pwrap{position:relative;}
.pwrap input{padding-right:46px;}
.eye{position:absolute;right:4px;top:4px;bottom:4px;width:38px;border-radius:9px;
  display:grid;place-items:center;font-size:16px;color:var(--muted);}
.eye:hover{background:rgba(255,255,255,.07);}

/* photo dots + tap zones on discovery cards */
.pdots{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:5px;z-index:4;}
.pdots span{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.32);}
.pdots span.on{background:#fff;}
.pnav{position:absolute;top:0;bottom:88px;width:36%;z-index:4;background:transparent;border:0;padding:0;}
.pnav.L{left:0;} .pnav.R{right:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;margin:14px 18px;}
.card h4{font-size:15px;font-family:var(--body);font-weight:600;letter-spacing:0;margin-bottom:12px;}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;text-align:left;font-size:15px;border-bottom:1px solid var(--line);}
.opt:last-child{border-bottom:0;}
.opt .ic{width:22px;text-align:center;}
.opt .ch{margin-left:auto;color:var(--faint);}
.opt.danger{color:#FF8F8F;}

/* ========================================================================
   ADMIN
   ==================================================================== */
.admin{max-width:1120px;margin:0 auto;padding:20px 22px 70px;}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;}
.stat .v{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.03em;}
.stat .k{font-size:12.6px;color:var(--faint);margin-top:2px;}
.atabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.atabs button{padding:9px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--muted);}
.atabs button[aria-selected="true"]{background:var(--cream);color:#23102F;font-weight:600;border-color:transparent;}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:rgba(255,255,255,.03);}
table{width:100%;border-collapse:collapse;min-width:720px;}
th,td{padding:12px 14px;text-align:left;font-size:13.8px;border-bottom:1px solid var(--line);vertical-align:middle;}
th{color:var(--faint);font-weight:500;font-size:12.4px;background:rgba(255,255,255,.03);}
tr:last-child td{border-bottom:0;}
.u-cell{display:flex;align-items:center;gap:10px;}
.u-cell img{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.6px;font-weight:600;}
.pill.active{background:rgba(18,203,196,.16);color:var(--turquoise);}
.pill.suspended{background:rgba(255,182,39,.16);color:var(--marigold);}
.pill.banned{background:rgba(255,80,80,.16);color:#FF8F8F;}
.pill.open{background:rgba(255,46,116,.16);color:#FF7FA6;}
.pill.reviewed{background:rgba(255,255,255,.1);color:var(--muted);}
.acts{display:flex;gap:6px;flex-wrap:wrap;}
.acts button{padding:6px 11px;border-radius:8px;font-size:12.4px;background:rgba(255,255,255,.08);border:1px solid var(--line);}
.acts button:hover{background:rgba(255,255,255,.15);}
.acts button.danger{color:#FF8F8F;border-color:rgba(255,90,90,.35);}
.search{max-width:320px;}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,1fr);}}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:200;
  background:rgba(255,244,230,.96);color:#23102F;padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);animation:pop .2s ease;max-width:90vw;text-align:center;}
</style>

function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);} return (h>>>0).toString(36); }
function isAdminEmail(e){ return CONFIG.adminEmails.map(x=>x.toLowerCase()).indexOf(String(e||"").trim().toLowerCase()) >= 0; }
function fmtTime(ts){ const d=new Date(ts); let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,"0"); const ap=h>=12?"pm":"am"; h=h%12||12; return h+":"+m+" "+ap; }
function fmtDay(ts){
  const d=new Date(ts), t=new Date(); const same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(d,t)) return "Today";
  const y=new Date(t.getTime()-864e5); if(same(d,y)) return "Yesterday";
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
function ago(ts){
  const s=Math.floor((now()-ts)/1000);
  if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago";
}
function toast(msg){
  const old=$(".toast"); if(old) old.remove();
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
const GRADS=[["#FF2E74","#FFB627"],["#8B5CFF","#12CBC4"],["#FF6B6B","#FFD166"],["#12CBC4","#8B5CFF"],["#F72585","#4CC9F0"],["#FFB627","#FF2E74"],["#5D5FEF","#FF8FB1"],["#00B4D8","#FFB627"]];
function avatar(name, seed){
  const g = GRADS[(seed|0) % GRADS.length];
  const ini = String(name||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='600' height='820' viewBox='0 0 600 820'>"+
    "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='"+g[0]+"'/><stop offset='1' stop-color='"+g[1]+"'/></linearGradient>"+
    "<pattern id='p' width='58' height='58' patternUnits='userSpaceOnUse'><circle cx='29' cy='29' r='3.5' fill='rgba(255,255,255,.22)'/></pattern></defs>"+
    "<rect width='600' height='820' fill='url(#g)'/><rect width='600' height='820' fill='url(#p)'/>"+
    "<circle cx='300' cy='356' r='150' fill='rgba(255,255,255,.14)'/>"+
    "<circle cx='300' cy='356' r='182' fill='none' stroke='rgba(255,255,255,.3)' stroke-width='2' stroke-dasharray='7 11'/>"+
    "<text x='300' y='408' font-family='Outfit,sans-serif' font-size='132' font-weight='700' fill='rgba(255,255,255,.95)' text-anchor='middle'>"+ini+"</text></svg>";
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function photoOf(u, idx){
  const photos = u && u.photos && u.photos.length ? u.photos : (u && u.photo ? [u.photo] : null);
  if(photos && photos.length) return photos[idx>=0 && idx<photos.length ? idx : 0];
  return avatar(u?u.name:"?", u?u.seed:0);
}

/* ========================================================================
   3. Store — the ONLY place that touches persistence.
      Swap these bodies for Supabase calls in phase 2; nothing else changes.
   ==================================================================== */
const K = { users:"gm:users", likes:"gm:likes", matches:"gm:matches", msgs:"gm:messages",
            reports:"gm:reports", blocks:"gm:blocks", session:"gm:session", seeded:"gm:seeded_v1" };

const Store = {
  _read(k, fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } },
  _write(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast("Storage is full — try a smaller photo"); return false; } },

  users(){ return this._read(K.users, []); },
  saveUsers(u){ return this._write(K.users, u); },
  user(id){ return this.users().find(x=>x.id===id) || null; },
  userByEmail(e){ const t=String(e||"").trim().toLowerCase(); return this.users().find(x=>x.email===t) || null; },
  upsertUser(u){ const all=this.users(); const i=all.findIndex(x=>x.id===u.id); if(i<0) all.push(u); else all[i]=u; return this.saveUsers(all); },
  deleteUser(id){
    this.saveUsers(this.users().filter(u=>u.id!==id));
    this._write(K.likes, this.likes().filter(l=>l.from!==id && l.to!==id));
    const gone = this.matches().filter(m=>m.a===id||m.b===id).map(m=>m.id);
    this._write(K.matches, this.matches().filter(m=>m.a!==id && m.b!==id));
    this._write(K.msgs, this.messages().filter(m=>gone.indexOf(m.matchId)<0));
    this._write(K.reports, this.reports().filter(r=>r.reported!==id && r.reporter!==id));
  },

  likes(){ return this._read(K.likes, []); },
  matches(){ return this._read(K.matches, []); },
  messages(){ return this._read(K.msgs, []); },
  reports(){ return this._read(K.reports, []); },
  blocks(){ return this._read(K.blocks, []); },

  session(){ const id=this._read(K.session,null); return id ? this.user(id) : null; },
  setSession(id){ this._write(K.session, id); },
  clearSession(){ try{ localStorage.removeItem(K.session); }catch(e){} },

  /* --- matching engine --- */
  swipe(fromId, toId, action){
    const likes=this.likes();
    if(!likes.some(l=>l.from===fromId && l.to===toId)) likes.push({from:fromId,to:toId,action,at:now()});
    this._write(K.likes, likes);
    if(action!=="like") return null;

    const target=this.user(toId);
    const theyLike = likes.some(l=>l.from===toId && l.to===fromId && l.action==="like")
                  || (target && target.likesBack);   // demo: seeded students who like you back
    if(!theyLike) return null;
    if(!likes.some(l=>l.from===toId && l.to===fromId)){
      likes.push({from:toId,to:fromId,action:"like",at:now()}); this._write(K.likes, likes);
    }
    const ms=this.matches();
    const existing = ms.find(m=>(m.a===fromId&&m.b===toId)||(m.a===toId&&m.b===fromId));
    if(existing){ if(!existing.active){ existing.active=true; this._write(K.matches,ms); } return existing; }
    const m={ id:uid("mt"), a:fromId, b:toId, at:now(), active:true };
    ms.push(m); this._write(K.matches, ms);
    return m;
  },
  matchesFor(id){
    const blocked=this.blocks();
    return this.matches().filter(m=>m.active && (m.a===id||m.b===id)).filter(m=>{
      const other = m.a===id?m.b:m.a;
      const u=this.user(other);
      if(!u || u.status==="banned") return false;
      return !blocked.some(b=>(b.by===id&&b.target===other)||(b.by===other&&b.target===id));
    }).sort((x,y)=>this.lastAt(y.id)-this.lastAt(x.id));
  },
  lastAt(matchId){
    const ms=this.messages().filter(m=>m.matchId===matchId);
    const mt=this.matches().find(m=>m.id===matchId);
    return ms.length ? ms[ms.length-1].at : (mt?mt.at:0);
  },
  thread(matchId){ return this.messages().filter(m=>m.matchId===matchId).sort((a,b)=>a.at-b.at); },
  send(matchId, from, body){
    const all=this.messages();
    const m={ id:uid("ms"), matchId, from, body:String(body).slice(0,1000), at:now(), read:false };
    all.push(m); this._write(K.msgs, all); return m;
  },
  markRead(matchId, me){
    const all=this.messages(); let touched=false;
    all.forEach(m=>{ if(m.matchId===matchId && m.from!==me && !m.read){ m.read=true; touched=true; } });
    if(touched) this._write(K.msgs, all);
  },
  unreadCount(me){
    const mine=this.matchesFor(me).map(m=>m.id);
    return this.messages().filter(m=>mine.indexOf(m.matchId)>=0 && m.from!==me && !m.read).length;
  },
  unmatch(matchId){
    const ms=this.matches(); const m=ms.find(x=>x.id===matchId);
    if(m){ m.active=false; this._write(K.matches, ms); }
  },
  block(by, target){
    const bs=this.blocks();
    if(!bs.some(b=>b.by===by&&b.target===target)){ bs.push({by,target,at:now()}); this._write(K.blocks,bs); }
    const m=this.matches().find(x=>x.active&&((x.a===by&&x.b===target)||(x.a===target&&x.b===by)));
    if(m) this.unmatch(m.id);
  },
  report(reporter, reported, reason, note){
    const rs=this.reports();
    rs.push({ id:uid("rp"), reporter, reported, reason, note:String(note||"").slice(0,400), status:"open", at:now() });
    this._write(K.reports, rs);
  },
  setReportStatus(id, status){ const rs=this.reports(); const r=rs.find(x=>x.id===id); if(r){ r.status=status; this._write(K.reports, rs); } },
  stats(){
    const us=this.users();
    return {
      users: us.length,
      active: us.filter(u=>u.status==="active" && now()-(u.lastActive||0) < 7*864e5).length,
      likes: this.likes().filter(l=>l.action==="like").length,
      matches: this.matches().filter(m=>m.active).length,
      reports: this.reports().filter(r=>r.status==="open").length
    };
  }
};

/* One-time cleanup: earlier versions of this app seeded demo accounts into
   real storage. This removes any of those so only genuine sign-ups remain. */
function purgeSeededAccounts(){
  const all = Store.users();
  const seeded = all.filter(u=>u.seeded);
  if(!seeded.length) return;
  seeded.forEach(u=> Store.deleteUser(u.id));
}

   ==================================================================== */
const app = $("#app");
let state = { auth:"login", tab:"discover", filters:{year:"",branch:"",height:""}, adminTab:"overview", adminQ:"" };

function go(path){ if(location.hash === "#"+path) render(); else location.hash = path; }
function route(){ return (location.hash||"#/").replace(/^#/,""); }

function render(){
  purgeSeededAccounts();
  const me = Store.session();
  const r = route();
  window.scrollTo(0,0);

  if(me){ me.lastActive = now(); Store.upsertUser(me); }

  if(r.indexOf("/admin")===0){
    if(!me || me.role!=="admin"){ app.innerHTML = adminLocked(); return; }
    return screenAdmin(me);
  }
  if(r.indexOf("/chat/")===0){
    if(!me) return go("/auth");
    return screenChat(me, r.split("/")[2]);
  }
  if(r.indexOf("/app")===0){
    if(!me) return go("/auth");
    if(!me.name) return screenOnboarding(me);
    const tab = r.split("/")[2] || "discover";
    state.tab = tab;
    if(tab==="matches") return screenMatches(me);
    if(tab==="profile") return screenProfile(me);
    return screenDiscover(me);
  }
  if(r.indexOf("/auth")===0){ if(me && me.name) return go("/app/discover"); return screenAuth(); }
  if(r.indexOf("/onboarding")===0){ if(!me) return go("/auth"); return screenOnboarding(me); }
  if(r.indexOf("/guidelines")===0) return screenGuidelines();
  return screenLanding();
}
window.addEventListener("hashchange", render);

/* ========================================================================
   8. Swipe engine (pointer events: mouse + touch)
   ==================================================================== */
function attachSwipe(card, onDone){
  let startX=0, startY=0, dx=0, dy=0, dragging=false, id=null;
  const like = $(".stamp.like", card), pass = $(".stamp.pass", card);
  const W = ()=> Math.min(window.innerWidth, 460);

  function down(e){
    if(e.button!==undefined && e.button!==0) return;
    dragging=true; id=e.pointerId; startX=e.clientX; startY=e.clientY;
    card.setPointerCapture && card.setPointerCapture(id);
    card.style.transition="none";
  }
  function move(e){
    if(!dragging || e.pointerId!==id) return;
    dx=e.clientX-startX; dy=e.clientY-startY;
    const rot = dx/18;
    card.style.transform = "translate("+dx+"px,"+dy*.32+"px) rotate("+rot+"deg)";
    const p = Math.min(Math.abs(dx)/110, 1);
    if(like) like.style.opacity = dx>0 ? p : 0;
    if(pass) pass.style.opacity = dx<0 ? p : 0;
  }
  function up(e){
    if(!dragging || (e.pointerId!==undefined && e.pointerId!==id)) return;
    dragging=false;
    const th = Math.max(88, W()*0.26);
    if(Math.abs(dx) > th){ fling(dx>0?"like":"pass"); }
    else {
      card.style.transition="transform .3s cubic-bezier(.2,1.2,.4,1)";
      card.style.transform="";
      if(like) like.style.opacity=0; if(pass) pass.style.opacity=0;
    }
    dx=0; dy=0;
  }
  function fling(dir){
    const out = dir==="like" ? window.innerWidth*1.1 : -window.innerWidth*1.1;
    card.style.transition="transform .42s cubic-bezier(.3,.6,.3,1), opacity .42s ease";
    card.style.transform="translate("+out+"px,"+(dir==="like"?-40:40)+"px) rotate("+(dir==="like"?26:-26)+"deg)";
    card.style.opacity="0";
    const s = dir==="like"?like:pass; if(s) s.style.opacity=1;
    setTimeout(()=>onDone(dir), 250);
  }
  card.addEventListener("pointerdown", down);
  card.addEventListener("pointermove", move);
  card.addEventListener("pointerup", up);
  card.addEventListener("pointercancel", up);
  card.addEventListener("dragstart", e=>e.preventDefault());
  return { fling };
}

      "<label class='field'><span>Email</span><input class='input' id='email' type='email' autocomplete='email' placeholder='you@example.com'></label>"+
      pwField("pass","Password","Your password","current-password")+

      "<button class='btn btn-primary btn-block' id='goLogin'>Log in</button>"+
      "<p class='center' style='margin-top:14px'><span class='link' data-m='reset'>Forgot password?</span></p>"+
      "<div class='card' style='margin:18px 0 0;padding:14px'><p class='hint'>Trying it out? Log in as a sample student: <b>ishita.sharma@student.iilm.edu.in</b> / demo1234</p></div>";

  $$("[data-m]").forEach(b=> b.onclick = ()=>{ state.auth = b.dataset.m; render(); });
  const err = m => { $("#err").textContent = m; };

  const login = ()=>{
    const e = $("#email").value.trim().toLowerCase(), p = $("#pass").value;
    if(!e || !p) return err("Enter your email and password.");
    const u = Store.userByEmail(e);
    if(!u || u.pass !== hash(p+"gm")) return err("That email and password don't match an account.");
    if(u.status==="banned") return err("This account has been banned for breaking the community guidelines.");
    if(u.status==="suspended") return err("This account is suspended. Contact the organisers.");
    if(isAdminEmail(u.email) && u.role!=="admin"){ u.role="admin"; Store.upsertUser(u); }
    Store.setSession(u.id);
    go(u.role==="admin" ? "/admin" : (u.name ? "/app/discover" : "/onboarding"));
  };
  const signup = ()=>{
    const e = $("#email").value.trim().toLowerCase(), p = $("#pass").value, p2 = $("#pass2").value;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return err("Enter a valid email address.");
    if(CONFIG.restrictToDomain && !e.endsWith("@"+CONFIG.allowedDomain)) return err("Use your "+CONFIG.allowedDomain+" email address.");
    if(p.length < 8) return err("Passwords need at least 8 characters.");
    if(p !== p2) return err("Those two passwords don't match.");
    if(!$("#age").checked) return err("You need to confirm you're "+CONFIG.minAge+" or older.");
    if(Store.userByEmail(e)) return err("An account already uses that email. Log in instead.");
    const u = { id:uid("u"), email:e, pass:hash(p+"gm"), role:isAdminEmail(e)?"admin":"user", status:"active",
      name:"", age:null, gender:"", year:"", branch:"", height:"", bio:"", insta:"", photos:[],
      seed: Math.floor(Math.random()*GRADS.length), likesBack:false, seeded:false,
      createdAt:now(), lastActive:now() };
    Store.upsertUser(u); Store.setSession(u.id); go("/onboarding");
  };
  const reset = ()=>{
    const e = $("#rEmail").value.trim().toLowerCase();
    const u = Store.userByEmail(e);
    if(!u) return err("No account uses that email.");
    const code = String(Math.floor(100000+Math.random()*900000));

      "<div class='card center' style='margin:0 0 16px;font-size:30px;font-family:var(--display);letter-spacing:.18em'>"+code+"</div>"+
      "<label class='field'><span>Enter the code</span><input class='input' id='cIn' inputmode='numeric' placeholder='6 digits'></label>"+
      pwField("npIn","New password","At least 8 characters","new-password")+
      "<div class='err' id='rerr'></div>"+
      "<button class='btn btn-primary btn-block' id='doReset'>Set new password</button>");
    wirePwToggles(w);
    $("#doReset",w).onclick = ()=>{
      if($("#cIn",w).value.trim() !== code) return $("#rerr",w).textContent="That code isn't right.";
      const np = $("#npIn",w).value;
      if(np.length < 8) return $("#rerr",w).textContent="Passwords need at least 8 characters.";
      u.pass = hash(np+"gm"); Store.upsertUser(u); w.remove();
      state.auth="login"; render(); toast("Password updated \u2014 log in");
    };
  };
  if($("#goLogin")) $("#goLogin").onclick = login;
  if($("#goSignup")) $("#goSignup").onclick = signup;
  if($("#goReset")) $("#goReset").onclick = reset;
  app.addEventListener("keydown", e=>{ if(e.key==="Enter"){ if($("#goLogin")) login(); else if($("#goSignup")) signup(); else if($("#goReset")) reset(); }});
  const f = $("#email")||$("#rEmail"); if(f) f.focus();
}

function readPhoto(file, cb, max, q){
  if(!file) return;
  if(!/^image\//.test(file.type)) return toast("Pick an image file");
  max = max || 560; q = q || 0.7;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",q));
    };
    img.onerror = ()=> toast("That image couldn't be read");
    img.src = fr.result;
  };
  fr.onerror = ()=> toast("That image couldn't be read");
  fr.readAsDataURL(file);
}

      "<p class='hint'>Only shown on your card if you add it. Leave it blank to stay private.</p></label>";
}
function collectProfile(u){
  const name = $("#pName").value.trim();
  const age = parseInt($("#pAge").value,10);
  const gender = $("#pGender").value, year = $("#pYear").value, branch = $("#pBranch").value;
  const height = $("#pHeight").value;
  const bio = $("#pBio").value.trim();
  const insta = $("#pInsta").value.trim().replace(/^@+/,"").replace(/\s+/g,"");
  if(name.length < 2) return {error:"Add your name so people know who they're matching with."};
  if(!age || age < CONFIG.minAge) return {error:"You need to be "+CONFIG.minAge+" or older to use GarbaMatch."};
  if(age > 60) return {error:"Check your age — that doesn't look right."};
  if(!gender) return {error:"Pick a gender so filters work properly."};
  if(!height) return {error:"Select your height."};
  if(!year) return {error:"Select your year."};
  if(!branch) return {error:"Select your branch."};
  if(bio.length < 10) return {error:"Write at least a short line for your bio."};
  if(!u.photos || !u.photos.length) return {error:"Add at least one photo — cards without one get skipped."};
  return {data:{name,age,gender,year,branch,bio,insta,height}};
}

function oppositeGender(g){
  if(g==="Male") return "Female";
  if(g==="Female") return "Male";
  return null; // legacy accounts with an older gender value see everyone
}
function candidates(me){
  const swiped = Store.likes().filter(l=>l.from===me.id).map(l=>l.to);
  const blocks = Store.blocks();
  const f = state.filters;
  const opp = oppositeGender(me.gender);
  return Store.users().filter(u=>
    u.id!==me.id && u.role!=="admin" && u.status==="active" && u.name && u.age &&
    swiped.indexOf(u.id)<0 &&
    !blocks.some(b=>(b.by===me.id&&b.target===u.id)||(b.by===u.id&&b.target===me.id)) &&
    (!opp || u.gender===opp) &&
    (!f.year || u.year===f.year) && (!f.branch || u.branch===f.branch) && (!f.height || u.height===f.height)
  );
}
function cardHTML(u){
  const photos = (u.photos && u.photos.length) ? u.photos : [photoOf(u)];
  const ig = u.insta ? "<a class='ig' href='https://instagram.com/"+encodeURIComponent(u.insta)+"' target='_blank' rel='noopener'>\uD83D\uDCF8 @"+esc(u.insta)+"</a>" : "";
  const dots = photos.length>1 ? "<div class='pdots'>"+photos.map((_,i)=>"<span class='"+(i===0?"on":"")+"'></span>").join("")+"</div>" : "";
  const nav = photos.length>1 ? "<button type='button' class='pnav L' aria-label='Previous photo'></button><button type='button' class='pnav R' aria-label='Next photo'></button>" : "";
  return "<img class='photo' alt='"+esc(u.name)+"' src='"+photos[0]+"'>"+
    "<div class='scrim'></div>"+ dots + nav +
    "<svg class='corner' viewBox='0 0 100 100'><g fill='none' stroke='rgba(255,255,255,.55)' stroke-width='1.4'>"+
      "<circle cx='100' cy='0' r='34'/><circle cx='100' cy='0' r='50' stroke-dasharray='5 8'/><circle cx='100' cy='0' r='66' stroke-dasharray='2 10'/></g></svg>"+
    "<div class='stamp like'>LIKE</div><div class='stamp pass'>PASS</div>"+
    "<div class='info'>"+
      "<div class='nm'><h3>"+esc(u.name.split(" ")[0])+"</h3><span class='ag'>"+u.age+" \u2022 "+esc(u.gender)+(u.height?" \u2022 "+esc(u.height):"")+"</span></div>"+
      "<p class='meta'>"+esc(u.year)+" \u2022 "+esc(u.branch)+"</p>"+
      "<p class='bio'>"+esc(u.bio)+"</p>"+ig+
    "</div>";
}
function wirePhotoNav(el, u){
  const photos = (u.photos && u.photos.length) ? u.photos : [photoOf(u)];
  if(photos.length<2) return;
  let idx = 0;
  const img = $(".photo", el);
  const dots = $$(".pdots span", el);
  $$(".pnav", el).forEach(btn=>{
    btn.addEventListener("pointerdown", e=> e.stopPropagation());
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const dir = btn.classList.contains("R") ? 1 : -1;
      idx = (idx + dir + photos.length) % photos.length;
      img.src = photos[idx];
      dots.forEach((d,i)=> d.classList.toggle("on", i===idx));
    });
  });
}

function mountDeck(me){
  const deck = $("#deck"); if(!deck) return;
  let queue = candidates(me);
  const actions = $(".deck-actions");

  function paint(){
    if(!queue.length){
      deck.innerHTML = "<div class='empty'><div class='big'>\uD83E\uDEA9</div><h3>That's everyone for now</h3>"+
        "<p>Come back later to discover more people"+(anyFilter()?" \u2014 or loosen your filters.":".")+"</p>"+
        (anyFilter()?"<button class='btn btn-ghost btn-sm' id='clr' style='margin-top:16px'>Clear filters</button>":"")+"</div>";
      if(actions) actions.style.display="none";
      const c=$("#clr"); if(c) c.onclick=()=>{ state.filters={year:"",branch:"",height:""}; render(); };
      return;
    }
    if(actions) actions.style.display="";
    deck.innerHTML = "";
    queue.slice(0,3).reverse().forEach((u,i,arr)=>{
      const depth = arr.length-1-i;
      const el = document.createElement("article");
      el.className = "pcard"; el.innerHTML = cardHTML(u);
      el.style.transform = "translateY("+(depth*10)+"px) scale("+(1-depth*.035)+")";
      el.style.opacity = depth>1 ? ".55" : "1";
      el.style.zIndex = String(10-depth);
      deck.appendChild(el);
      wirePhotoNav(el, u);
      if(depth===0){
        el.style.transform = "";
        const sw = attachSwipe(el, dir => resolve(u, dir));
        if($("#bLike")) $("#bLike").onclick = ()=> sw.fling("like");
        if($("#bPass")) $("#bPass").onclick = ()=> sw.fling("pass");
      }
    });
  }
  function anyFilter(){ const f=state.filters; return !!(f.year||f.branch||f.height); }
  function resolve(u, dir){
    const m = Store.swipe(me.id, u.id, dir==="like"?"like":"pass");
    queue = queue.filter(x=>x.id!==u.id);
    paint();
    if(m) showMatch(me, u, m);
  }
  paint();
}
function filterSheet(){
  const f = state.filters;
  const opts=(arr,v)=> "<option value=''>Anyone</option>"+arr.map(x=>"<option value=\""+esc(x)+"\""+(x===v?" selected":"")+">"+esc(x)+"</option>").join("");
  const w = modal("<h3>Filters</h3><p class='sub'>Your deck already only shows students of the opposite gender. Narrow it further:</p>"+
    "<label class='field'><span>Year</span><select class='select' id='fY'>"+opts(YEARS,f.year)+"</select></label>"+
    "<label class='field'><span>Branch</span><select class='select' id='fB'>"+opts(BRANCHES,f.branch)+"</select></label>"+
    "<label class='field'><span>Height</span><select class='select' id='fH'>"+opts(HEIGHTS,f.height)+"</select></label>"+
    "<button class='btn btn-primary btn-block' id='apply' style='margin-top:6px'>Apply filters</button>"+
    "<button class='btn btn-ghost btn-block' id='clear' style='margin-top:10px'>Clear all</button>");
  $("#apply",w).onclick = ()=>{ state.filters={year:$("#fY",w).value,branch:$("#fB",w).value,height:$("#fH",w).value}; w.remove(); render(); };
  $("#clear",w).onclick = ()=>{ state.filters={year:"",branch:"",height:""}; w.remove(); render(); };
}

function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#FFB627","#FF2E74","#12CBC4","#FF6B3D","#8B5CFF"];
  for(let i=0;i<70;i++){
    const d=document.createElement("i");
    d.className="confetti";
    d.style.left=Math.random()*100+"vw";
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.9+Math.random()*1.5)+"s";
    d.style.animationDelay=(Math.random()*.5)+"s";
    d.style.opacity=String(.7+Math.random()*.3);
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),3800);
  }
}
function showMatch(me, other, match){
  const w=document.createElement("div"); w.className="match-screen";
  w.innerHTML = "<div>"+
    "<div class='match-faces'><img alt='' src='"+photoOf(me)+"'><img alt='' src='"+photoOf(other)+"'></div>"+

    "<p class='match-sub'>You and "+esc(other.name.split(" ")[0])+" are both interested!</p>"+

    "<div><button class='btn btn-ghost' id='keep' style='margin-top:12px;min-width:210px'>Keep swiping</button></div>"+
  "</div>";
  document.body.appendChild(w); confetti();
  $("#chat",w).onclick = ()=>{ w.remove(); go("/chat/"+match.id); };
  $("#keep",w).onclick = ()=> w.remove();
}

function screenMatches(me){
  const ms = Store.matchesFor(me.id);
  let body;
  if(!ms.length){
    body = "<div class='empty'><div class='big'>\uD83D\uDC40</div><h3>No matches yet</h3><p>Keep discovering. A match happens the moment you both swipe right.</p>"+
      "<a class='btn btn-primary btn-sm' href='#/app/discover' style='margin-top:18px'>Back to Discover</a></div>";
  } else {
    body = "<div class='list'>"+ ms.map(m=>{
      const other = Store.user(m.a===me.id?m.b:m.a);
      const th = Store.thread(m.id);
      const last = th.length ? th[th.length-1] : null;
      const unread = last && last.from!==me.id && !last.read;
      const preview = last ? (last.from===me.id?"You: ":"")+last.body : "You matched "+ago(m.at)+" \u2014 say hi";
      return "<a href='#/chat/"+m.id+"' style='text-decoration:none'><div class='mrow'>"+
        "<img alt='' src='"+photoOf(other)+"'>"+
        "<div class='txt'><h4>"+esc(other.name.split(" ")[0])+"</h4>"+
        "<p class='meta'>"+other.age+" \u2022 "+esc(other.year)+" \u2022 "+esc(other.branch)+"</p>"+
        "<p class='last"+(unread?" unread":"")+"'>"+esc(preview)+"</p></div>"+
        "<span class='btn btn-ghost btn-sm'>Chat</span></div></a>";
    }).join("") + "</div>";
  }
  app.innerHTML = "<div class='shell'>"+
    "<header class='topbar'><div class='logo'>Matches</div>"+
      "<span class='tag'>"+ms.length+" "+(ms.length===1?"match":"matches")+"</span></header>"+
    body + "</div>" + tabbar("matches", me);
}

/* ========================================================================
   14. Chat
   ==================================================================== */
const REPLIES = ["Haha okay, you're on \uD83E\uDEA9","Wait do you actually know the 3-step or are we both faking it","See you at Garba \uD83D\uDE2D","I'm bringing extra dandiya sticks, don't worry","Perfect. Let's meet near the entrance first","Okay this is happening \uD83D\uDD25","Which songs are you hoping they play?"];
function screenChat(me, matchId){
  const m = Store.matches().find(x=>x.id===matchId);
  if(!m || (m.a!==me.id && m.b!==me.id) || !m.active){
    app.innerHTML = "<div class='pane'><div class='pane-inner center'><div class='sheet'>"+
      "<h2>Chat unavailable</h2><p class='sub'>This conversation has ended \u2014 you may have unmatched or blocked each other.</p>"+
      "<a class='btn btn-primary btn-block' href='#/app/matches'>Back to matches</a></div></div></div>";
    return;
  }
  const other = Store.user(m.a===me.id?m.b:m.a);
  Store.markRead(m.id, me.id);

  app.innerHTML = "<div class='chat' style='position:relative'>"+
    "<header class='chat-head'>"+
      "<a href='#/app/matches' style='font-size:20px;text-decoration:none;padding:2px 4px'>\u2190</a>"+
      "<img alt='' src='"+photoOf(other)+"'>"+
      "<div class='who'><h4>"+esc(other.name)+"</h4><p>"+esc(other.year)+" \u2022 "+esc(other.branch)+"</p></div>"+
      "<button class='icon-btn' id='more' title='More options'>\u22EF</button>"+
    "</header>"+
    "<div class='msgs' id='msgs'></div>"+
    "<form class='composer' id='form'><input id='inp' placeholder='Message "+esc(other.name.split(" ")[0])+"' autocomplete='off' maxlength='1000'>"+
    "<button class='send' id='send' type='submit' disabled>\u27A4</button></form>"+
  "</div>";

  const box = $("#msgs"), inp = $("#inp"), send = $("#send");
  function paint(){
    const th = Store.thread(m.id);
    if(!th.length){
      box.innerHTML = "<div class='empty' style='min-height:0;padding:34px 20px'><div class='big'>\uD83E\uDEA9</div>"+
        "<h3>You matched with "+esc(other.name.split(" ")[0])+"</h3>"+
        "<p>Only the two of you can see this chat. Start with something about "+esc(CONFIG.eventName)+".</p></div>";
      return;
    }
    let last = "";
    box.innerHTML = th.map(msg=>{
      const side = msg.from===me.id ? "me":"them";
      const day = fmtDay(msg.at);
      let head = "";
      if(day!==last){ head = "<div class='day'>"+esc(day)+"</div>"; last = day; }
      return head + "<div class='bub "+side+"'>"+esc(msg.body)+"</div><div class='ts "+side+"'>"+fmtTime(msg.at)+"</div>";
    }).join("");
    box.scrollTop = box.scrollHeight;
  }
  paint();

  inp.oninput = ()=> send.disabled = !inp.value.trim();
  $("#form").onsubmit = e=>{
    e.preventDefault();
    const v = inp.value.trim(); if(!v) return;
    Store.send(m.id, me.id, v);
    inp.value=""; send.disabled=true; paint();
    if(CONFIG.demoAutoReply && other.seeded && Store.thread(m.id).filter(x=>x.from===other.id).length===0){
      setTimeout(()=>{
        if(!Store.matches().find(x=>x.id===m.id && x.active)) return;
        Store.send(m.id, other.id, REPLIES[Math.floor(Math.random()*REPLIES.length)]);
        if(route()==="/chat/"+m.id){ Store.markRead(m.id, me.id); paint(); }
      }, 1600);
    }
  };
  $("#more").onclick = e=>{
    e.stopPropagation();
    const old=$(".menu"); if(old){ old.remove(); return; }
    const mn = document.createElement("div"); mn.className="menu";
    mn.innerHTML = "<button data-a='unmatch'>Unmatch</button><button data-a='block' class='danger'>Block "+esc(other.name.split(" ")[0])+"</button><button data-a='report' class='danger'>Report</button>";
    $(".chat").appendChild(mn);
    setTimeout(()=> document.addEventListener("click", function once(){ mn.remove(); document.removeEventListener("click", once); }), 0);
    $$("[data-a]",mn).forEach(b=> b.onclick = ()=>{
      const a=b.dataset.a; mn.remove();
      if(a==="unmatch") confirmBox("Unmatch "+other.name.split(" ")[0]+"?","You'll both disappear from each other's matches and this chat is gone.","Unmatch",()=>{ Store.unmatch(m.id); go("/app/matches"); toast("Unmatched"); });
      if(a==="block") confirmBox("Block "+other.name.split(" ")[0]+"?","They won't appear in your deck again and neither of you can message the other.","Block",()=>{ Store.block(me.id, other.id); go("/app/matches"); toast("Blocked"); });
      if(a==="report") reportBox(me, other, ()=>{ go("/app/matches"); });
    });
  };
}
function confirmBox(title, sub, label, onYes){
  const w = modal("<h3>"+esc(title)+"</h3><p class='sub'>"+esc(sub)+"</p>"+
    "<button class='btn btn-danger btn-block' id='y'>"+esc(label)+"</button>"+
    "<button class='btn btn-ghost btn-block' id='n' style='margin-top:10px'>Cancel</button>");
  $("#y",w).onclick = ()=>{ w.remove(); onYes(); };
  $("#n",w).onclick = ()=> w.remove();
}
function reportBox(me, other, after){
  const w = modal("<h3>Report "+esc(other.name.split(" ")[0])+"</h3>"+
    "<p class='sub'>An admin reviews every report. Reporting also blocks them, so you won't hear from them again.</p>"+
    "<label class='field'><span>Reason</span><select class='select' id='rr'>"+REPORT_REASONS.map(r=>"<option>"+esc(r)+"</option>").join("")+"</select></label>"+
    "<label class='field'><span>What happened? (optional)</span><textarea class='textarea' id='rn' maxlength='400' placeholder='Add anything that helps the admin understand.'></textarea></label>"+
    "<button class='btn btn-danger btn-block' id='go'>Send report and block</button>"+
    "<button class='btn btn-ghost btn-block' id='no' style='margin-top:10px'>Cancel</button>");
  $("#go",w).onclick = ()=>{
    Store.report(me.id, other.id, $("#rr",w).value, $("#rn",w).value);
    Store.block(me.id, other.id);
    w.remove(); toast("Report sent to admins"); if(after) after();
  };
  $("#no",w).onclick = ()=> w.remove();
}

  app.innerHTML = "<div class='shell'>"+
    "<header class='topbar'><div class='logo'>Profile</div>"+
      (me.role==="admin" ? "<a class='btn btn-ghost btn-sm' href='#/admin'>Admin panel</a>" : "")+"</header>"+
    "<div class='me-head'>"+
      "<div class='me-photo'><img alt='Your profile picture' src='"+photoOf(me)+"'></div>"+
      "<h2>"+esc(me.name)+"</h2>"+
      "<p class='meta'>"+me.age+" \u2022 "+esc(me.gender)+(me.height?" \u2022 "+esc(me.height):"")+"<br>"+esc(me.year)+" \u2022 "+esc(me.branch)+"</p>"+
      "<div style='display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap'>"+
        "<span class='tag'>\u2764\uFE0F "+myLikes+" likes sent</span><span class='tag'>\uD83E\uDEA9 "+myMatches+" matches</span>"+ig+
      "</div>"+
    "</div>"+
    "<div class='card'><h4>Your bio</h4><p style='font-size:14.8px;line-height:1.5;color:var(--muted)'>"+esc(me.bio)+"</p>"+
      "<button class='btn btn-ghost btn-block btn-sm' id='edit' style='margin-top:16px'>Edit profile</button></div>"+
    "<div class='card'><h4>Account</h4>"+
      "<button class='opt' id='share'><span class='ic'>\uD83D\uDCE3</span>Share GarbaMatch<span class='ch'>\u203A</span></button>"+
      "<a class='opt' href='#/guidelines' style='text-decoration:none'><span class='ic'>\uD83D\uDEE1\uFE0F</span>Community guidelines<span class='ch'>\u203A</span></a>"+
      "<button class='opt' id='blocked'><span class='ic'>\uD83D\uDEAB</span>Blocked users<span class='ch'>\u203A</span></button>"+
      "<button class='opt' id='logout'><span class='ic'>\uD83D\uDEAA</span>Log out<span class='ch'>\u203A</span></button>"+
      "<button class='opt danger' id='del'><span class='ic'>\uD83D\uDDD1\uFE0F</span>Delete my account<span class='ch'>\u203A</span></button>"+
    "</div>"+
    "<p class='hint center' style='padding:0 26px 10px'>Your email and password are never shown to other students. "+esc(CONFIG.eventName)+" \u00B7 "+esc(CONFIG.eventDate)+"</p>"+
  "</div>"+ tabbar("profile", me);

  $("#edit").onclick = ()=> editProfile(me);
  $("#share").onclick = shareSheet;
  $("#logout").onclick = ()=> confirmBox("Log out?","You can log back in any time with your email and password.","Log out",()=>{ Store.clearSession(); go("/"); });
  $("#blocked").onclick = ()=>{
    const list = Store.blocks().filter(b=>b.by===me.id).map(b=>Store.user(b.target)).filter(Boolean);
    const w = modal("<h3>Blocked users</h3>"+(list.length
      ? "<p class='sub'>They can't see you and you can't see them.</p>"+list.map(u=>"<div class='mrow' style='margin-bottom:8px'><img alt='' src='"+photoOf(u)+"'><div class='txt'><h4>"+esc(u.name)+"</h4><p class='meta'>"+esc(u.year)+" \u2022 "+esc(u.branch)+"</p></div><button class='btn btn-ghost btn-sm' data-un='"+u.id+"'>Unblock</button></div>").join("")
      : "<p class='sub'>You haven't blocked anyone.</p>")+
      "<button class='btn btn-ghost btn-block' id='c' style='margin-top:8px'>Close</button>");
    $("#c",w).onclick=()=>w.remove();
    $$("[data-un]",w).forEach(b=> b.onclick = ()=>{
      Store._write(K.blocks, Store.blocks().filter(x=>!(x.by===me.id && x.target===b.dataset.un)));
      w.remove(); toast("Unblocked");
    });
  };
  $("#del").onclick = ()=> confirmBox("Delete your account?","Your profile, matches and messages are removed for good. This can't be undone.","Delete account",()=>{
    Store.deleteUser(me.id); Store.clearSession(); go("/"); toast("Account deleted");
  });
}
function editProfile(me){
  const draft = Object.assign({}, me, { photos:(me.photos||[]).slice() });
  const w = modal("<h3>Edit profile</h3><p class='sub'>Changes show on your card straight away.</p>"+
    "<div id='ePhotoHost'></div>"+
    profileFields(draft)+
    "<div class='err' id='err'></div>"+
    "<button class='btn btn-primary btn-block' id='save'>Save changes</button>"+
    "<button class='btn btn-ghost btn-block' id='cancel' style='margin-top:10px'>Cancel</button>");
  bindBioCount();
  mountPhotoSlots($("#ePhotoHost",w), draft);
  $("#cancel",w).onclick = ()=> w.remove();
  $("#save",w).onclick = ()=>{
    const r = collectProfile(draft);
    if(r.error) return $("#err",w).textContent = r.error;
    Object.assign(me, r.data, {photos:draft.photos});
    Store.upsertUser(me); w.remove(); render(); toast("Profile saved");
  };
}

function screenAdmin(me){
  const s = Store.stats();
  const tab = state.adminTab;
  const t=(k,l)=> "<button data-t='"+k+"' aria-selected='"+(tab===k)+"'>"+l+"</button>";
  app.innerHTML = garland()+"<div class='admin'>"+
    "<header class='admin-head'>"+
      "<div><div class='logo' style='font-size:23px'>GarbaMatch <b>\uD83E\uDEA9</b> admin</div>"+
      "<p class='hint' style='margin-top:4px'>"+esc(CONFIG.university)+", "+esc(CONFIG.campus)+" \u00B7 signed in as "+esc(me.email)+"</p></div>"+
      "<div style='display:flex;gap:8px'><a class='btn btn-ghost btn-sm' href='#/app/discover'>Open app</a>"+
      "<button class='btn btn-ghost btn-sm' id='out'>Log out</button></div>"+
    "</header>"+
    "<div class='stats'>"+
      stat(s.users,"Registered users")+stat(s.active,"Active this week")+stat(s.likes,"Likes")+
      stat(s.matches,"Matches")+stat(s.reports,"Open reports")+
    "</div>"+
    "<div class='atabs'>"+t("overview","Overview")+t("users","Users")+t("reports","Reports")+t("matches","Matches")+"</div>"+
    "<div id='apane'></div></div>";

  function stat(v,k){ return "<div class='stat'><div class='v'>"+v+"</div><div class='k'>"+esc(k)+"</div></div>"; }
  $("#out").onclick = ()=>{ Store.clearSession(); go("/"); };
  $$("[data-t]").forEach(b=> b.onclick = ()=>{ state.adminTab=b.dataset.t; render(); });

  const pane = $("#apane");
  if(tab==="overview") pane.innerHTML = adminOverview();
  if(tab==="users") adminUsers(pane, me);
  if(tab==="reports") adminReports(pane);
  if(tab==="matches") pane.innerHTML = adminMatches();
}
function adminOverview(){
  const us = Store.users().filter(u=>u.role!=="admin");
  const byBranch = {}; const byYear = {};
  us.forEach(u=>{ if(u.branch) byBranch[u.branch]=(byBranch[u.branch]||0)+1; if(u.year) byYear[u.year]=(byYear[u.year]||0)+1; });
  const bar = obj => {
    const max = Math.max.apply(null,[1].concat(Object.values(obj)));
    return Object.keys(obj).sort((a,b)=>obj[b]-obj[a]).slice(0,8).map(k=>
      "<div style='display:flex;align-items:center;gap:12px;margin-bottom:9px'>"+
      "<span style='width:140px;font-size:13.4px;color:var(--muted);flex:none'>"+esc(k)+"</span>"+
      "<span style='flex:1;height:9px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden'>"+
      "<i style='display:block;height:100%;width:"+(obj[k]/max*100)+"%;background:linear-gradient(90deg,var(--magenta),var(--marigold))'></i></span>"+
      "<b style='width:26px;text-align:right;font-size:13.4px'>"+obj[k]+"</b></div>").join("");
  };
  const recent = us.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);
  return "<div style='display:grid;grid-template-columns:1fr 1fr;gap:14px' class='ov'>"+
    "<div class='card' style='margin:0'><h4>Students by branch</h4>"+(Object.keys(byBranch).length?bar(byBranch):"<p class='hint'>No profiles yet.</p>")+"</div>"+
    "<div class='card' style='margin:0'><h4>Students by year</h4>"+(Object.keys(byYear).length?bar(byYear):"<p class='hint'>No profiles yet.</p>")+"</div>"+
    "<div class='card' style='margin:0;grid-column:1/-1'><h4>Newest sign-ups</h4>"+
      (recent.length? recent.map(u=>"<div class='mrow' style='margin-bottom:8px'><img alt='' src='"+photoOf(u)+"'>"+
      "<div class='txt'><h4>"+esc(u.name||"(profile not finished)")+"</h4><p class='meta'>"+esc(u.email)+" \u00B7 joined "+ago(u.createdAt)+"</p></div>"+
      "<span class='pill "+u.status+"'>"+u.status+"</span></div>").join("") : "<p class='hint'>Nobody has signed up yet.</p>")+
    "</div></div>";
}
function adminUsers(pane, me){
  const q = state.adminQ.trim().toLowerCase();
  const us = Store.users().filter(u=>u.role!=="admin").filter(u=>
    !q || (u.name||"").toLowerCase().includes(q) || u.email.toLowerCase().includes(q) ||
    (u.branch||"").toLowerCase().includes(q) || (u.year||"").toLowerCase().includes(q));
  pane.innerHTML = "<div style='display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap'>"+
    "<input class='input search' id='q' placeholder='Search name, email, branch or year' value='"+esc(state.adminQ)+"'>"+
    "<span class='tag' style='align-self:center'>"+us.length+" shown</span></div>"+
    (us.length ? "<div class='tbl-wrap'><table><thead><tr><th>Student</th><th>Details</th><th>Joined</th><th>Status</th><th>Actions</th></tr></thead><tbody>"+
    us.map(u=>"<tr><td><div class='u-cell'><img alt='' src='"+photoOf(u)+"'><div><b>"+esc(u.name||"(incomplete)")+"</b><div style='color:var(--faint);font-size:12.2px'>"+esc(u.email)+"</div></div></div></td>"+
      "<td>"+(u.age?u.age+" \u2022 "+esc(u.gender)+"<br>":"")+esc(u.year||"-")+" \u2022 "+esc(u.branch||"-")+"</td>"+
      "<td>"+ago(u.createdAt)+"</td>"+
      "<td><span class='pill "+u.status+"'>"+u.status+"</span></td>"+
      "<td><div class='acts'>"+
        "<button data-view='"+u.id+"'>View</button>"+
        (u.status==="active"?"<button data-susp='"+u.id+"'>Suspend</button>":"<button data-act='"+u.id+"'>Reactivate</button>")+
        (u.status==="banned"?"<button data-unban='"+u.id+"'>Unban</button>":"<button class='danger' data-ban='"+u.id+"'>Ban</button>")+
        "<button class='danger' data-del='"+u.id+"'>Delete</button>"+
      "</div></td></tr>").join("")+"</tbody></table></div>"
    : "<div class='empty'><div class='big'>\uD83D\uDD0D</div><h3>No users match that search</h3><p>Try a different name, branch or year.</p></div>");

  const qi = $("#q",pane);
  qi.oninput = ()=>{ state.adminQ = qi.value; adminUsers(pane, me); const n=$("#q",pane); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };

  $$("[data-view]",pane).forEach(b=> b.onclick=()=> adminViewUser(Store.user(b.dataset.view)));
  $$("[data-susp]",pane).forEach(b=> b.onclick=()=> setStatus(b.dataset.susp,"suspended","Suspended"));
  $$("[data-act]",pane).forEach(b=> b.onclick=()=> setStatus(b.dataset.act,"active","Reactivated"));
  $$("[data-ban]",pane).forEach(b=> b.onclick=()=> confirmBox("Ban this student?","They can't log in and their profile disappears from everyone's deck.","Ban",()=> setStatus(b.dataset.ban,"banned","Banned")));
  $$("[data-unban]",pane).forEach(b=> b.onclick=()=> setStatus(b.dataset.unban,"active","Unbanned"));
  $$("[data-del]",pane).forEach(b=> b.onclick=()=> confirmBox("Delete this account?","Their profile, likes, matches and messages are removed for good.","Delete",()=>{
    Store.deleteUser(b.dataset.del); toast("Account deleted"); render();
  }));
  function setStatus(id, status, word){
    const u = Store.user(id); if(!u) return;
    u.status = status; Store.upsertUser(u); toast(word); render();
  }
}
function adminViewUser(u){
  if(!u) return;
  const likes = Store.likes().filter(l=>l.from===u.id && l.action==="like").length;
  const mts = Store.matches().filter(m=>m.active && (m.a===u.id||m.b===u.id)).length;
  const rep = Store.reports().filter(r=>r.reported===u.id).length;
  const w = modal("<div style='display:flex;gap:14px;align-items:center;margin-bottom:16px'>"+
    "<img alt='' src='"+photoOf(u)+"' style='width:72px;height:72px;border-radius:50%;object-fit:cover'>"+
    "<div><h3 style='margin-bottom:2px'>"+esc(u.name||"(incomplete)")+"</h3>"+
    "<p class='hint'>"+esc(u.email)+"</p><span class='pill "+u.status+"' style='margin-top:6px'>"+u.status+"</span></div></div>"+
    "<div class='card' style='margin:0 0 12px'>"+
      "<p style='font-size:14.2px;line-height:1.7'><b>Age</b> "+(u.age||"-")+" \u00B7 <b>Gender</b> "+esc(u.gender||"-")+" \u00B7 <b>Height</b> "+esc(u.height||"not shared")+"<br>"+
      "<b>Year</b> "+esc(u.year||"-")+" \u00B7 <b>Branch</b> "+esc(u.branch||"-")+"<br>"+
      "<b>Instagram</b> "+(u.insta?"@"+esc(u.insta):"not shared")+"<br>"+
      "<b>Joined</b> "+new Date(u.createdAt).toLocaleDateString()+" \u00B7 <b>Last active</b> "+ago(u.lastActive||u.createdAt)+"</p></div>"+
    "<div class='card' style='margin:0 0 12px'><h4>Bio</h4><p style='font-size:14.2px;color:var(--muted);line-height:1.5'>"+esc(u.bio||"(empty)")+"</p></div>"+
    "<div style='display:flex;gap:10px;margin-bottom:16px'>"+
      "<span class='tag'>\u2764\uFE0F "+likes+" likes</span><span class='tag'>\uD83E\uDEA9 "+mts+" matches</span><span class='tag'>\uD83D\uDEA9 "+rep+" reports</span></div>"+
    "<button class='btn btn-ghost btn-block' id='clearPhoto'>Remove all photos</button>"+
    "<button class='btn btn-ghost btn-block' id='clearBio' style='margin-top:10px'>Clear bio</button>"+
    "<button class='btn btn-ghost btn-block' id='c' style='margin-top:10px'>Close</button>");
  $("#c",w).onclick=()=>w.remove();
  $("#clearPhoto",w).onclick=()=>{ u.photos=[]; Store.upsertUser(u); w.remove(); toast("Photos removed"); render(); };
  $("#clearBio",w).onclick=()=>{ u.bio="Bio removed by a moderator."; Store.upsertUser(u); w.remove(); toast("Bio cleared"); render(); };
}
function adminReports(pane){
  const rs = Store.reports().slice().sort((a,b)=>b.at-a.at);
  if(!rs.length){ pane.innerHTML = "<div class='empty'><div class='big'>\u2705</div><h3>No reports</h3><p>Reports students send from a chat land here for review.</p></div>"; return; }
  pane.innerHTML = "<div class='tbl-wrap'><table><thead><tr><th>Reported</th><th>Reason</th><th>Note</th><th>By</th><th>When</th><th>Status</th><th>Actions</th></tr></thead><tbody>"+
    rs.map(r=>{
      const u = Store.user(r.reported), by = Store.user(r.reporter);
      return "<tr><td><div class='u-cell'>"+(u?"<img alt='' src='"+photoOf(u)+"'><div><b>"+esc(u.name||u.email)+"</b><div style='color:var(--faint);font-size:12.2px'>"+esc(u.year||"")+"</div></div>":"<i>deleted user</i>")+"</div></td>"+
        "<td>"+esc(r.reason)+"</td><td style='max-width:240px;color:var(--muted)'>"+esc(r.note||"\u2014")+"</td>"+
        "<td>"+esc(by?(by.name||by.email):"deleted")+"</td><td>"+ago(r.at)+"</td>"+
        "<td><span class='pill "+r.status+"'>"+r.status+"</span></td>"+
        "<td><div class='acts'>"+(u?"<button data-open='"+u.id+"'>View</button><button class='danger' data-ban='"+u.id+"'>Ban</button>":"")+
        (r.status==="open"?"<button data-done='"+r.id+"'>Mark reviewed</button>":"<button data-reopen='"+r.id+"'>Reopen</button>")+"</div></td></tr>";
    }).join("")+"</tbody></table></div>";
  $$("[data-open]",pane).forEach(b=> b.onclick=()=> adminViewUser(Store.user(b.dataset.open)));
  $$("[data-ban]",pane).forEach(b=> b.onclick=()=> confirmBox("Ban this student?","They can't log in and disappear from every deck.","Ban",()=>{
    const u=Store.user(b.dataset.ban); if(u){ u.status="banned"; Store.upsertUser(u); } toast("Banned"); render(); }));
  $$("[data-done]",pane).forEach(b=> b.onclick=()=>{ Store.setReportStatus(b.dataset.done,"reviewed"); render(); });
  $$("[data-reopen]",pane).forEach(b=> b.onclick=()=>{ Store.setReportStatus(b.dataset.reopen,"open"); render(); });
}
function adminMatches(){
  const ms = Store.matches().slice().sort((a,b)=>b.at-a.at);
  if(!ms.length) return "<div class='empty'><div class='big'>\uD83E\uDEA9</div><h3>No matches yet</h3><p>Matches appear here as students start swiping right on each other.</p></div>";
  return "<div class='tbl-wrap'><table><thead><tr><th>Student A</th><th>Student B</th><th>Matched</th><th>Messages</th><th>Status</th></tr></thead><tbody>"+
    ms.map(m=>{
      const a=Store.user(m.a), b=Store.user(m.b), c=Store.thread(m.id).length;
      const cell=u=> u? "<div class='u-cell'><img alt='' src='"+photoOf(u)+"'><div><b>"+esc(u.name||u.email)+"</b><div style='color:var(--faint);font-size:12.2px'>"+esc(u.year||"")+" "+esc(u.branch||"")+"</div></div></div>" : "<i>deleted</i>";
      return "<tr><td>"+cell(a)+"</td><td>"+cell(b)+"</td><td>"+ago(m.at)+"</td><td>"+c+"</td>"+
        "<td><span class='pill "+(m.active?"active":"reviewed")+"'>"+(m.active?"active":"unmatched")+"</span></td></tr>";
    }).join("")+"</tbody></table></div>";
}

/* ========================================================================
   18. Boot
   ==================================================================== */
render();
})();
</script>
</body>
